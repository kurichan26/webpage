<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geometry Dash</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
        background: #101828;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 1040px);
        display: grid;
        gap: 12px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 56px);
        line-height: 1;
        letter-spacing: 0;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: #facc15;
        color: #111827;
        cursor: pointer;
        font: inherit;
        font-size: 22px;
        font-weight: 900;
      }

      button:hover {
        background: #fde047;
      }

      .hud {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .metric {
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.72);
      }

      .label {
        color: #94a3b8;
        font-size: 11px;
        font-weight: 900;
      }

      .value {
        margin-top: 2px;
        font-size: 24px;
        font-weight: 950;
        line-height: 1;
      }

      .stage {
        position: relative;
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 4px solid #0f172a;
        border-radius: 8px;
        background: #18a8ff;
        box-shadow: 0 22px 64px rgba(0, 0, 0, 0.42);
      }

      .jump {
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: 96px;
        height: 68px;
        border-radius: 8px;
        background: rgba(250, 204, 21, 0.9);
        font-size: 18px;
      }

      @media (max-width: 720px) {
        body {
          padding: 12px;
        }

        .topbar {
          align-items: start;
          flex-direction: column;
        }

        .hud {
          grid-template-columns: 1fr;
        }

        .value {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <h1>GEOMETRY DASH</h1>
        <div class="actions">
          <button id="restart" type="button" aria-label="リスタート">↻</button>
        </div>
      </div>

      <div class="hud" aria-label="ゲーム情報">
        <div class="metric">
          <div class="label">ATTEMPT</div>
          <div class="value" id="attempt">1</div>
        </div>
        <div class="metric">
          <div class="label">PROGRESS</div>
          <div class="value" id="progress">0%</div>
        </div>
        <div class="metric">
          <div class="label">BEST</div>
          <div class="value" id="best">0%</div>
        </div>
      </div>

      <div class="stage">
        <canvas id="game" width="960" height="540" aria-label="Geometry Dashのゲーム画面"></canvas>
        <button class="jump" id="jump" type="button" aria-label="スペースキーでジャンプ">SPACE</button>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const restartButton = document.querySelector("#restart");
      const jumpButton = document.querySelector("#jump");
      const attemptEl = document.querySelector("#attempt");
      const progressEl = document.querySelector("#progress");
      const bestEl = document.querySelector("#best");

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const GROUND_Y = 430;
      const LEVEL_LENGTH = 5200;
      const PLAYER_SIZE = 42;
      const TILE = 42;

      const player = {
        x: 142,
        y: GROUND_Y - PLAYER_SIZE,
        size: PLAYER_SIZE,
        vy: 0,
        rotation: 0,
        grounded: true,
      };

      const obstacles = [
        { type: "spike", x: 660, w: 42, h: 42 },
        { type: "spike", x: 980, w: 42, h: 42 },
        { type: "block", x: 1290, w: 42, h: 42 },
        { type: "spike", x: 1620, w: 42, h: 42 },
        { type: "spike", x: 1880, w: 42, h: 42 },
        { type: "block", x: 2190, w: 84, h: 42 },
        { type: "spike", x: 2520, w: 42, h: 42 },
        { type: "spike", x: 2780, w: 42, h: 42 },
        { type: "block", x: 3090, w: 42, h: 42 },
        { type: "spike", x: 3400, w: 42, h: 42 },
        { type: "spike", x: 3650, w: 42, h: 42 },
        { type: "block", x: 3940, w: 84, h: 42 },
        { type: "spike", x: 4300, w: 42, h: 42 },
        { type: "spike", x: 4560, w: 42, h: 42 },
        { type: "spike", x: 4820, w: 42, h: 42 },
      ];
      const decorations = [
        { type: "saw", x: 1500, y: 295, r: 24 },
        { type: "ring", x: 2360, y: 270, r: 18 },
        { type: "saw", x: 2980, y: 310, r: 22 },
        { type: "ring", x: 3820, y: 255, r: 18 },
        { type: "saw", x: 4700, y: 300, r: 24 },
      ];

      let cameraX = 0;
      let speed = 5.1;
      let attempt = 1;
      let best = 0;
      let gameOver = false;
      let completed = false;
      let particles = [];
      let lastTime = 0;

      function resetLevel(incrementAttempt = false) {
        if (incrementAttempt) attempt++;
        cameraX = 0;
        speed = 5.1;
        gameOver = false;
        completed = false;
        particles = [];
        player.y = GROUND_Y - player.size;
        player.vy = 0;
        player.rotation = 0;
        player.grounded = true;
        updateHud();
      }

      function jump() {
        if (gameOver || completed) {
          resetLevel(true);
          return;
        }

        if (player.grounded) {
          player.vy = -16.2;
          player.grounded = false;
          burst(player.x + player.size / 2, player.y + player.size, "#facc15", 12);
        }
      }

      function burst(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.7) * 7,
            size: 3 + Math.random() * 5,
            life: 28 + Math.random() * 18,
            color,
          });
        }
      }

      function updateHud() {
        const progress = Math.min(100, Math.floor((cameraX / LEVEL_LENGTH) * 100));
        best = Math.max(best, progress);
        attemptEl.textContent = attempt;
        progressEl.textContent = completed ? "100%" : `${progress}%`;
        bestEl.textContent = `${best}%`;
      }

      function update() {
        if (!gameOver && !completed) {
          cameraX += speed;
          speed = Math.min(7.2, speed + 0.0008);

          player.vy += 0.78;
          player.y += player.vy;
          if (player.y + player.size >= GROUND_Y) {
            player.y = GROUND_Y - player.size;
            player.vy = 0;
            player.grounded = true;
            player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
          } else {
            player.rotation += 0.18;
          }

          if (hitsObstacle()) {
            gameOver = true;
            burst(player.x + player.size / 2, player.y + player.size / 2, "#fb7185", 34);
          }

          if (cameraX >= LEVEL_LENGTH) {
            completed = true;
            burst(WIDTH * 0.5, HEIGHT * 0.42, "#34d399", 80);
          }
        }

        particles = particles.filter((particle) => {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vy += 0.22;
          particle.life--;
          return particle.life > 0;
        });

        updateHud();
      }

      function hitsObstacle() {
        const box = {
          x: player.x + 10,
          y: player.y + 10,
          w: player.size - 20,
          h: player.size - 20,
        };

        return obstacles.some((obstacle) => {
          const ox = obstacle.x - cameraX;
          if (ox > player.x + player.size + 20 || ox + obstacle.w < player.x - 20) return false;
          const oy = GROUND_Y - obstacle.h;

          if (obstacle.type === "block") {
            return box.x < ox + obstacle.w - 8 &&
              box.x + box.w > ox + 8 &&
              box.y < oy + obstacle.h - 8 &&
              box.y + box.h > oy + 8;
          }

          const spike = {
            x: ox + obstacle.w / 2,
            y: oy,
            left: ox,
            right: ox + obstacle.w,
            bottom: GROUND_Y,
          };
          return box.x < spike.right - 12 &&
            box.x + box.w > spike.left + 12 &&
            box.y + box.h > spike.y + 22 &&
            box.y < spike.bottom - 4;
        });
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        sky.addColorStop(0, "#1db6ff");
        sky.addColorStop(0.56, "#1297f2");
        sky.addColorStop(1, "#0759c7");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
        ctx.lineWidth = 1;
        for (let x = -((cameraX * 0.35) % TILE); x < WIDTH; x += TILE) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, HEIGHT);
          ctx.stroke();
        }
        for (let y = 10; y < GROUND_Y; y += TILE) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }

        ctx.globalAlpha = 0.22;
        for (let i = 0; i < 22; i++) {
          const x = (i * 211 - cameraX * 0.16) % (WIDTH + 120) - 60;
          const y = 42 + ((i * 67) % 260);
          drawDiamond(x, y, 10 + (i % 3) * 3, "#bff3ff");
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#0b1220";
        ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);
        ctx.fillStyle = "#00e5ff";
        ctx.fillRect(0, GROUND_Y - 5, WIDTH, 5);

        for (let x = -((cameraX * 1.2) % TILE); x < WIDTH; x += TILE) {
          drawGroundTile(x, GROUND_Y, TILE, TILE);
          drawGroundTile(x, GROUND_Y + TILE, TILE, TILE);
        }
      }

      function drawDiamond(x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y - size);
        ctx.lineTo(x + size, y);
        ctx.lineTo(x, y + size);
        ctx.lineTo(x - size, y);
        ctx.closePath();
        ctx.fill();
      }

      function drawGroundTile(x, y, w, h) {
        ctx.fillStyle = "#111827";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#1d4ed8";
        ctx.fillRect(x + 5, y + 5, w - 10, h - 10);
        ctx.strokeStyle = "#050816";
        ctx.lineWidth = 4;
        ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 8, y + 8, w - 16, h - 16);
      }

      function drawObstacle(obstacle) {
        const x = obstacle.x - cameraX;
        const y = GROUND_Y - obstacle.h;
        if (x > WIDTH + 80 || x + obstacle.w < -80) return;

        if (obstacle.type === "block") {
          for (let tx = x; tx < x + obstacle.w - 1; tx += TILE) {
            for (let ty = y; ty < GROUND_Y - 1; ty += TILE) {
              drawStageBlock(tx, ty, Math.min(TILE, x + obstacle.w - tx), Math.min(TILE, GROUND_Y - ty));
            }
          }
          return;
        }

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x + obstacle.w / 2, y);
        ctx.lineTo(x + obstacle.w, GROUND_Y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(x + 9, GROUND_Y - 5);
        ctx.lineTo(x + obstacle.w / 2, y + 13);
        ctx.lineTo(x + obstacle.w - 9, GROUND_Y - 5);
        ctx.closePath();
        ctx.fill();
      }

      function drawStageBlock(x, y, w, h) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#8b5cf6";
        ctx.fillRect(x + 5, y + 5, w - 10, h - 10);
        ctx.strokeStyle = "#050816";
        ctx.lineWidth = 4;
        ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.34)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 10, y + 10, w - 20, h - 20);
      }

      function drawDecoration(decoration) {
        const x = decoration.x - cameraX;
        if (x < -80 || x > WIDTH + 80) return;
        if (decoration.type === "ring") {
          ctx.save();
          ctx.shadowColor = "#facc15";
          ctx.shadowBlur = 14;
          ctx.strokeStyle = "#facc15";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(x, decoration.y, decoration.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
          return;
        }

        ctx.save();
        ctx.translate(x, decoration.y);
        ctx.rotate(cameraX * 0.04);
        ctx.fillStyle = "#e5e7eb";
        ctx.strokeStyle = "#020617";
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const radius = i % 2 === 0 ? decoration.r : decoration.r * 0.56;
          const angle = (Math.PI * 2 * i) / 16;
          ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawPlayer() {
        ctx.save();
        ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
        ctx.rotate(player.rotation);
        ctx.shadowColor = "#facc15";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#facc15";
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fef3c7";
        ctx.fillRect(-player.size / 2 + 6, -player.size / 2 + 6, player.size - 12, 8);
        ctx.fillStyle = "#111827";
        ctx.fillRect(-10, -4, 6, 6);
        ctx.fillRect(8, -4, 6, 6);
        ctx.fillRect(-7, 12, 22, 5);
        ctx.strokeStyle = "#050816";
        ctx.lineWidth = 4;
        ctx.strokeRect(-player.size / 2 + 2, -player.size / 2 + 2, player.size - 4, player.size - 4);
        ctx.restore();
      }

      function drawParticles() {
        particles.forEach((particle) => {
          ctx.globalAlpha = Math.max(0, particle.life / 44);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
        });
        ctx.globalAlpha = 1;
      }

      function drawOverlay() {
        drawProgressBar();
        if (!gameOver && !completed) return;
        ctx.fillStyle = "rgba(15, 23, 42, 0.62)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = completed ? "#34d399" : "#fb7185";
        ctx.font = "900 64px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(completed ? "CLEAR" : "CRASH", WIDTH / 2, HEIGHT / 2 - 18);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 24px system-ui, sans-serif";
        ctx.fillText("RESTART", WIDTH / 2, HEIGHT / 2 + 34);
      }

      function drawProgressBar() {
        const progress = Math.min(1, cameraX / LEVEL_LENGTH);
        const barWidth = 320;
        const x = WIDTH / 2 - barWidth / 2;
        const y = 22;
        ctx.fillStyle = "rgba(2, 6, 23, 0.55)";
        ctx.fillRect(x, y, barWidth, 14);
        ctx.fillStyle = "#facc15";
        ctx.fillRect(x + 3, y + 3, (barWidth - 6) * progress, 8);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, barWidth, 14);
      }

      function draw() {
        drawBackground();
        decorations.forEach(drawDecoration);
        obstacles.forEach(drawObstacle);
        drawPlayer();
        drawParticles();
        drawOverlay();
      }

      function loop(time = 0) {
        const delta = time - lastTime;
        lastTime = time;
        if (delta < 80) update();
        draw();
        requestAnimationFrame(loop);
      }

      document.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          jump();
        }
      });

      canvas.addEventListener("pointerdown", jump);
      jumpButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        jump();
      });
      restartButton.addEventListener("click", () => resetLevel(true));

      resetLevel();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
