<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自己紹介</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4ef;
        --text: #202124;
        --muted: #5f6368;
        --accent: #2f6f73;
        --line: #d8d2c6;
        --paper: #fffdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      main {
        width: min(100%, 680px);
        padding: 40px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(32, 33, 36, 0.08);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 8vw, 56px);
        line-height: 1.1;
      }

      .lead {
        margin: 20px 0 28px;
        color: var(--muted);
        font-size: 18px;
      }

      section {
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      ul {
        margin: 0;
        padding-left: 20px;
      }

      li + li {
        margin-top: 8px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 8px 14px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: var(--accent);
        color: white;
      }

      @media (max-width: 520px) {
        main {
          padding: 28px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Profile</p>
      <h1>山田 太郎</h1>
      <p class="lead">
        Web制作とデザインが好きな学生です。使いやすく、見た目にも心地よいページづくりを勉強しています。
      </p>

      <section aria-labelledby="about-heading">
        <h2 id="about-heading">自己紹介</h2>
        <ul>
          <li>出身地: 東京都</li>
          <li>趣味: 写真、読書、カフェ巡り</li>
          <li>興味のあること: HTML、CSS、JavaScript</li>
          <li>目標: 自分の作品を公開できるポートフォリオを作ること</li>
        </ul>
      </section>

      <div class="links" aria-label="関連リンク">
        <a href="mailto:example@example.com">メール</a>
        <a href="https://github.com/" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </main>
  </body>
</html>
