<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>テトリス</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #111827;
        color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 820px);
        display: grid;
        grid-template-columns: minmax(240px, 300px) minmax(220px, 1fr);
        gap: 18px;
        align-items: start;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1;
        letter-spacing: 0;
      }

      canvas {
        display: block;
        width: min(100%, 300px);
        aspect-ratio: 1 / 2;
        background: #0f172a;
        border: 3px solid #e5e7eb;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      .panel {
        display: grid;
        gap: 12px;
      }

      .box {
        padding: 14px;
        background: #f9fafb;
        border-radius: 8px;
        color: #111827;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .label {
        color: #6b7280;
        font-size: 12px;
        font-weight: 800;
      }

      .value {
        margin-top: 4px;
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
      }

      .preview-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(96px, 1fr));
        gap: 10px;
      }

      #next,
      #hold {
        width: 96px;
        height: 96px;
        border: 2px solid #d1d5db;
        box-shadow: none;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      button:hover {
        background: #1d4ed8;
      }

      .mode-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .skin-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .mode-button,
      .skin-button {
        min-height: 40px;
        background: #e5e7eb;
        color: #111827;
        padding: 6px;
      }

      .mode-button[aria-pressed="true"],
      .skin-button[aria-pressed="true"] {
        background: #2563eb;
        color: #ffffff;
      }

      ul {
        margin: 8px 0 0;
        padding-left: 20px;
        color: #4b5563;
      }

      .message {
        min-height: 44px;
        display: grid;
        align-items: center;
        color: #dc2626;
        font-weight: 800;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }

        canvas {
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="board" width="300" height="600" aria-label="テトリスのゲーム画面"></canvas>

      <section class="panel" aria-label="ゲーム情報">
        <div>
          <h1>TETRIS</h1>
        </div>

        <div class="box stats">
          <div>
            <div class="label">SCORE</div>
            <div class="value" id="score">0</div>
          </div>
          <div>
            <div class="label">LINES</div>
            <div class="value" id="lines">0</div>
          </div>
          <div>
            <div class="label">LEVEL</div>
            <div class="value" id="level">1</div>
          </div>
        </div>

        <div class="preview-row">
          <div class="box">
            <div class="label">HOLD</div>
            <canvas id="hold" width="120" height="120" aria-label="ホールド中のブロック"></canvas>
          </div>

          <div class="box">
            <div class="label">NEXT</div>
            <canvas id="next" width="120" height="120" aria-label="次のブロック"></canvas>
          </div>
        </div>

        <div class="box">
          <button id="restart">リスタート</button>
          <div class="message" id="message"></div>
        </div>

        <div class="box">
          <div class="label">MODE</div>
          <div class="mode-controls" aria-label="テトリスのモード">
            <button class="mode-button" type="button" data-mode="normal" aria-pressed="true">ノーマル</button>
            <button class="mode-button" type="button" data-mode="warped" aria-pressed="false">変形</button>
          </div>
        </div>

        <div class="box">
          <div class="label">SKIN</div>
          <div class="skin-controls" aria-label="ミノのスキン">
            <button class="skin-button" type="button" data-skin="classic" aria-pressed="true">クラシック</button>
            <button class="skin-button" type="button" data-skin="neon" aria-pressed="false">ネオン</button>
            <button class="skin-button" type="button" data-skin="mono" aria-pressed="false">モノ</button>
            <button class="skin-button" type="button" data-skin="candy" aria-pressed="false">キャンディ</button>
            <button class="skin-button" type="button" data-skin="galaxy" aria-pressed="false">ギャラクシー</button>
          </div>
        </div>

        <div class="box">
          <div class="label">KEYBOARD</div>
          <ul>
            <li>← / →: 左右に移動</li>
            <li>W: 早く落とす</li>
            <li>A: 右回転</li>
            <li>D: 左回転</li>
            <li>S: ホールド</li>
            <li>Space: 一気に落とす</li>
            <li>P: 一時停止</li>
          </ul>
        </div>
      </section>
    </main>

    <script>
      const COLS = 10;
      const ROWS = 20;
      const CELL = 30;
      const LOCK_DELAY = 1500;
      const LOCK_RESET_LIMIT = 15;
      const TYPES = ["I", "J", "L", "O", "S", "T", "Z"];
      const COLORS = {
        I: "#22d3ee",
        J: "#3b82f6",
        L: "#f97316",
        O: "#eab308",
        S: "#22c55e",
        T: "#a855f7",
        Z: "#ef4444",
      };
      const SKINS = {
        classic: {
          colors: COLORS,
          highlight: "rgba(255, 255, 255, 0.2)",
          shadow: "rgba(0, 0, 0, 0.22)",
          glow: false,
        },
        neon: {
          colors: {
            I: "#67e8f9",
            J: "#60a5fa",
            L: "#fb923c",
            O: "#fde047",
            S: "#4ade80",
            T: "#c084fc",
            Z: "#fb7185",
          },
          highlight: "rgba(255, 255, 255, 0.38)",
          shadow: "rgba(0, 0, 0, 0.18)",
          glow: true,
        },
        mono: {
          colors: {
            I: "#f8fafc",
            J: "#dbeafe",
            L: "#cbd5e1",
            O: "#e5e7eb",
            S: "#94a3b8",
            T: "#bfc7d5",
            Z: "#64748b",
          },
          highlight: "rgba(255, 255, 255, 0.28)",
          shadow: "rgba(15, 23, 42, 0.28)",
          glow: false,
        },
        candy: {
          colors: {
            I: "#7dd3fc",
            J: "#93c5fd",
            L: "#fdba74",
            O: "#fef08a",
            S: "#86efac",
            T: "#f0abfc",
            Z: "#fda4af",
          },
          highlight: "rgba(255, 255, 255, 0.48)",
          shadow: "rgba(127, 29, 29, 0.12)",
          glow: false,
        },
        galaxy: {
          colors: {
            I: "#38bdf8",
            J: "#818cf8",
            L: "#f472b6",
            O: "#facc15",
            S: "#34d399",
            T: "#c084fc",
            Z: "#fb7185",
          },
          highlight: "rgba(255, 255, 255, 0.5)",
          shadow: "rgba(15, 23, 42, 0.4)",
          glow: true,
          stars: true,
        },
      };
      const SHAPE_SETS = {
        normal: {
          I: [[1, 1, 1, 1]],
          J: [[1, 0, 0], [1, 1, 1]],
          L: [[0, 0, 1], [1, 1, 1]],
          O: [[1, 1], [1, 1]],
          S: [[0, 1, 1], [1, 1, 0]],
          T: [[0, 1, 0], [1, 1, 1]],
          Z: [[1, 1, 0], [0, 1, 1]],
        },
      };
      const WARPED_SHAPE_SETS = [
        {
          I: [[1, 1, 1, 1], [0, 0, 1, 0]],
          J: [[1, 0, 0], [1, 1, 0]],
          L: [[0, 0, 1], [1, 1, 1], [1, 0, 0]],
          O: [[1, 1], [1, 0]],
          S: [[0, 1, 1], [1, 1, 0], [0, 1, 0]],
          T: [[0, 1, 0], [1, 1, 0]],
          Z: [[1, 1, 0], [0, 1, 1], [0, 0, 1]],
        },
        {
          I: [[1, 1, 1], [1, 0, 1]],
          J: [[1, 0], [1, 0], [1, 1], [0, 1]],
          L: [[0, 1], [0, 1], [1, 1], [1, 0]],
          O: [[1, 1], [1, 1], [0, 1]],
          S: [[0, 1, 1], [1, 1, 0], [0, 1, 0]],
          T: [[0, 1, 0], [1, 1, 1], [1, 0, 0]],
          Z: [[1, 1, 0], [0, 1, 0]],
        },
        {
          I: [[1, 1, 1]],
          J: [[1, 0], [1, 1]],
          L: [[0, 1], [1, 1]],
          O: [[1, 1], [1, 0]],
          S: [[0, 1], [1, 1]],
          T: [[0, 1, 0], [1, 1, 1], [0, 0, 1]],
          Z: [[1, 1], [0, 1]],
        },
        {
          I: [[1, 1, 1, 1], [1, 0, 0, 0]],
          J: [[1, 0, 0], [1, 1, 1], [0, 0, 1]],
          L: [[0, 0, 1], [1, 1, 1], [1, 0, 0]],
          O: [[1, 1, 1], [1, 1, 0]],
          S: [[0, 1, 1], [1, 1, 0], [0, 0, 1]],
          T: [[0, 1, 0], [1, 1, 0]],
          Z: [[1, 1, 0], [0, 1, 1], [0, 1, 0]],
        },
        {
          I: [[1, 1, 1, 1], [0, 1, 0, 0]],
          J: [[1, 0, 0], [1, 1, 1], [0, 1, 0]],
          L: [[0, 1], [0, 1], [1, 1], [1, 0]],
          O: [[1, 1], [0, 1]],
          S: [[0, 1, 0], [1, 1, 1], [1, 0, 0]],
          T: [[0, 1, 0], [1, 1, 0]],
          Z: [[1, 1, 0], [0, 1, 1], [1, 0, 0]],
        },
      ];

      const boardCanvas = document.querySelector("#board");
      const boardCtx = boardCanvas.getContext("2d");
      const holdCanvas = document.querySelector("#hold");
      const holdCtx = holdCanvas.getContext("2d");
      const nextCanvas = document.querySelector("#next");
      const nextCtx = nextCanvas.getContext("2d");
      const scoreEl = document.querySelector("#score");
      const linesEl = document.querySelector("#lines");
      const levelEl = document.querySelector("#level");
      const messageEl = document.querySelector("#message");
      const restartButton = document.querySelector("#restart");
      const modeButtons = document.querySelectorAll(".mode-button");
      const skinButtons = document.querySelectorAll(".skin-button");

      let board;
      let piece;
      let holdPiece;
      let nextPiece;
      let score;
      let lines;
      let level;
      let dropInterval;
      let dropCounter;
      let lockCounter;
      let lockResetCount;
      let lastTime;
      let isPaused;
      let isGameOver;
      let canHold;
      let animationId;
      let pieceBag;
      let activeMode = "normal";
      let activeSkin = "classic";
      let clearEffects = [];

      function createBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(""));
      }

      function cloneShape(shape) {
        return shape.map((row) => row.slice());
      }

      function createPiece() {
        if (pieceBag.length === 0) refillBag();
        const type = pieceBag.pop();
        return makePiece(type);
      }

      function refillBag() {
        pieceBag = TYPES.slice();
        for (let i = pieceBag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pieceBag[i], pieceBag[j]] = [pieceBag[j], pieceBag[i]];
        }
      }

      function makePiece(type) {
        const shape = activeMode === "warped"
          ? cloneShape(randomWarpedShape(type))
          : cloneShape(SHAPE_SETS.normal[type]);
        return {
          type,
          shape,
          x: Math.floor((COLS - shape[0].length) / 2),
          y: 0,
        };
      }

      function randomWarpedShape(type) {
        const set = WARPED_SHAPE_SETS[Math.floor(Math.random() * WARPED_SHAPE_SETS.length)];
        return set[type];
      }

      function startGame() {
        cancelAnimationFrame(animationId);
        board = createBoard();
        pieceBag = [];
        piece = createPiece();
        holdPiece = null;
        nextPiece = createPiece();
        score = 0;
        lines = 0;
        level = 1;
        dropInterval = 900;
        dropCounter = 0;
        lockCounter = 0;
        lockResetCount = 0;
        clearEffects = [];
        lastTime = 0;
        isPaused = false;
        isGameOver = false;
        canHold = true;
        messageEl.textContent = "";
        updateStats();
        draw();
        animationId = requestAnimationFrame(update);
      }

      function updateModeControls() {
        modeButtons.forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.mode === activeMode);
        });
      }

      function setMode(mode) {
        if (mode === activeMode) return;
        activeMode = mode;
        updateModeControls();
        startGame();
      }

      function updateSkinControls() {
        skinButtons.forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.skin === activeSkin);
        });
      }

      function setSkin(skin) {
        if (skin === activeSkin) return;
        activeSkin = skin;
        updateSkinControls();
        draw();
      }

      function updateStats() {
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
      }

      function rotate(shape) {
        return shape[0].map((_, x) => shape.map((row) => row[x]).reverse());
      }

      function rotateLeft(shape) {
        return shape[0].map((_, x) => shape.map((row) => row[shape[0].length - 1 - x]));
      }

      function hasCollision(target, offsetX = 0, offsetY = 0, shape = target.shape) {
        for (let y = 0; y < shape.length; y++) {
          for (let x = 0; x < shape[y].length; x++) {
            if (!shape[y][x]) continue;
            const boardX = target.x + x + offsetX;
            const boardY = target.y + y + offsetY;
            if (boardX < 0 || boardX >= COLS || boardY >= ROWS) return true;
            if (boardY >= 0 && board[boardY][boardX]) return true;
          }
        }
        return false;
      }

      function mergePiece() {
        piece.shape.forEach((row, y) => {
          row.forEach((cell, x) => {
            if (cell) board[piece.y + y][piece.x + x] = piece.type;
          });
        });
      }

      function clearLines() {
        let cleared = 0;
        const clearedRows = [];
        for (let y = ROWS - 1; y >= 0; y--) {
          if (board[y].every(Boolean)) {
            clearedRows.push(y);
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(""));
            cleared++;
            y++;
          }
        }

        if (cleared > 0) {
          startLineClearEffect(clearedRows);
          score += [0, 100, 300, 500, 800][cleared] * level;
          lines += cleared;
          level = Math.floor(lines / 10) + 1;
          dropInterval = Math.max(120, 900 - (level - 1) * 75);
          updateStats();
        }
      }

      function startLineClearEffect(rows) {
        const now = performance.now();
        rows.forEach((row) => {
          clearEffects.push({
            row,
            start: now,
            particles: Array.from({ length: 34 }, () => ({
              x: Math.random() * COLS * CELL,
              y: row * CELL + CELL / 2,
              vx: (Math.random() - 0.5) * 10,
              vy: (Math.random() - 0.5) * 8,
              size: 2 + Math.random() * 6,
              color: ["#ffffff", "#facc15", "#38bdf8", "#c084fc"][Math.floor(Math.random() * 4)],
            })),
          });
        });
      }

      function spawnPiece() {
        piece = nextPiece;
        piece.x = Math.floor((COLS - piece.shape[0].length) / 2);
        piece.y = 0;
        nextPiece = createPiece();
        canHold = true;
        lockCounter = 0;
        lockResetCount = 0;

        if (hasCollision(piece)) {
          isGameOver = true;
          messageEl.textContent = "GAME OVER";
          cancelAnimationFrame(animationId);
        }
      }

      function isGrounded() {
        return hasCollision(piece, 0, 1);
      }

      function resetLockDelayAfterMove() {
        if (!isGrounded()) {
          lockCounter = 0;
          lockResetCount = 0;
          return;
        }

        if (lockResetCount < LOCK_RESET_LIMIT) {
          lockCounter = 0;
          lockResetCount++;
        }
      }

      function lockPiece() {
        mergePiece();
        clearLines();
        spawnPiece();
        updateStats();
      }

      function move(dx) {
        if (isPaused || isGameOver) return;
        if (!hasCollision(piece, dx, 0)) {
          piece.x += dx;
          resetLockDelayAfterMove();
          draw();
        }
      }

      function softDrop() {
        if (isPaused || isGameOver) return;
        if (!hasCollision(piece, 0, 1)) {
          piece.y++;
          score += 1;
          updateStats();
          lockCounter = 0;
          lockResetCount = 0;
        } else {
          if (lockCounter >= LOCK_DELAY) lockPiece();
        }
        dropCounter = 0;
        draw();
      }

      function hardDrop() {
        if (isPaused || isGameOver) return;
        let distance = 0;
        while (!hasCollision(piece, 0, 1)) {
          piece.y++;
          distance++;
        }
        score += distance * 2;
        lockPiece();
        draw();
      }

      function rotatePiece(direction) {
        if (isPaused || isGameOver) return;
        const rotated = direction === "left" ? rotateLeft(piece.shape) : rotate(piece.shape);
        for (const kick of [0, -1, 1, -2, 2]) {
          if (!hasCollision(piece, kick, 0, rotated)) {
            piece.x += kick;
            piece.shape = rotated;
            resetLockDelayAfterMove();
            draw();
            return;
          }
        }
      }

      function holdCurrentPiece() {
        if (isPaused || isGameOver || !canHold) return;
        const currentType = piece.type;

        if (holdPiece) {
          piece = makePiece(holdPiece.type);
          holdPiece = makePiece(currentType);
        } else {
          holdPiece = makePiece(currentType);
          piece = nextPiece;
          nextPiece = createPiece();
        }

        piece.x = Math.floor((COLS - piece.shape[0].length) / 2);
        piece.y = 0;
        canHold = false;
        lockCounter = 0;
        lockResetCount = 0;

        if (hasCollision(piece)) {
          isGameOver = true;
          messageEl.textContent = "GAME OVER";
          cancelAnimationFrame(animationId);
        }

        draw();
      }

      function togglePause() {
        if (isGameOver) return;
        isPaused = !isPaused;
        messageEl.textContent = isPaused ? "PAUSED" : "";
        if (!isPaused) {
          lastTime = performance.now();
          animationId = requestAnimationFrame(update);
        }
      }

      function drawCell(ctx, x, y, size, type) {
        const skin = SKINS[activeSkin];
        const color = skin.colors[type];
        ctx.save();
        if (skin.glow) {
          ctx.shadowColor = color;
          ctx.shadowBlur = size * 0.45;
        }
        ctx.fillStyle = color;
        ctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
        ctx.shadowBlur = 0;
        ctx.fillStyle = skin.highlight;
        ctx.fillRect(x * size + 4, y * size + 4, size - 8, 5);
        ctx.fillStyle = skin.shadow;
        ctx.fillRect(x * size + 4, y * size + size - 8, size - 8, 3);

        if (skin.stars) {
          const baseX = x * size;
          const baseY = y * size;
          ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
          ctx.fillRect(baseX + size * 0.28, baseY + size * 0.3, 2, 2);
          ctx.fillRect(baseX + size * 0.68, baseY + size * 0.58, 2, 2);
          ctx.fillStyle = "rgba(250, 204, 21, 0.95)";
          ctx.fillRect(baseX + size * 0.52, baseY + size * 0.22, 1.5, 1.5);
        }
        ctx.restore();
      }

      function drawBoard() {
        boardCtx.fillStyle = "#0f172a";
        boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        boardCtx.strokeStyle = "rgba(255, 255, 255, 0.08)";

        for (let x = 0; x <= COLS; x++) {
          boardCtx.beginPath();
          boardCtx.moveTo(x * CELL, 0);
          boardCtx.lineTo(x * CELL, ROWS * CELL);
          boardCtx.stroke();
        }

        for (let y = 0; y <= ROWS; y++) {
          boardCtx.beginPath();
          boardCtx.moveTo(0, y * CELL);
          boardCtx.lineTo(COLS * CELL, y * CELL);
          boardCtx.stroke();
        }

        board.forEach((row, y) => {
          row.forEach((type, x) => {
            if (type) drawCell(boardCtx, x, y, CELL, type);
          });
        });
      }

      function drawPiece() {
        piece.shape.forEach((row, y) => {
          row.forEach((cell, x) => {
            if (cell) drawCell(boardCtx, piece.x + x, piece.y + y, CELL, piece.type);
          });
        });
      }

      function drawNext() {
        drawPreview(nextCtx, nextCanvas, nextPiece);
      }

      function drawHold() {
        drawPreview(holdCtx, holdCanvas, holdPiece);
      }

      function drawPreview(ctx, canvas, previewPiece) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (!previewPiece) return;
        const size = 24;
        const offsetX = Math.floor((5 - previewPiece.shape[0].length) / 2);
        const offsetY = Math.floor((5 - previewPiece.shape.length) / 2);

        previewPiece.shape.forEach((row, y) => {
          row.forEach((cell, x) => {
            if (cell) drawCell(ctx, x + offsetX, y + offsetY, size, previewPiece.type);
          });
        });
      }

      function drawClearEffects(now = performance.now()) {
        clearEffects = clearEffects.filter((effect) => {
          const age = now - effect.start;
          const progress = age / 520;
          if (progress >= 1) return false;

          const alpha = 1 - progress;
          const centerX = COLS * CELL / 2;
          const centerY = effect.row * CELL + CELL / 2;
          const rowY = effect.row * CELL;
          boardCtx.save();
          boardCtx.globalCompositeOperation = "lighter";
          boardCtx.globalAlpha = alpha * 0.85;
          const beam = boardCtx.createLinearGradient(0, rowY, COLS * CELL, rowY + CELL);
          beam.addColorStop(0, "#38bdf8");
          beam.addColorStop(0.5, "#ffffff");
          beam.addColorStop(1, "#c084fc");
          boardCtx.fillStyle = beam;
          boardCtx.fillRect(0, rowY + CELL * 0.08, COLS * CELL, CELL * 0.84);

          boardCtx.globalAlpha = alpha * 0.75;
          boardCtx.strokeStyle = "#facc15";
          boardCtx.lineWidth = 3;
          boardCtx.beginPath();
          boardCtx.arc(centerX, centerY, 18 + progress * 170, 0, Math.PI * 2);
          boardCtx.stroke();

          boardCtx.strokeStyle = "#38bdf8";
          boardCtx.lineWidth = 2;
          boardCtx.beginPath();
          boardCtx.arc(centerX, centerY, 8 + progress * 105, 0, Math.PI * 2);
          boardCtx.stroke();

          effect.particles.forEach((particle) => {
            const px = particle.x + particle.vx * age * 0.16;
            const py = particle.y + particle.vy * age * 0.16;
            boardCtx.globalAlpha = alpha;
            boardCtx.fillStyle = particle.color;
            boardCtx.fillRect(px, py, particle.size, particle.size);
          });
          boardCtx.restore();
          return true;
        });
      }

      function draw() {
        drawBoard();
        drawPiece();
        drawClearEffects();
        drawHold();
        drawNext();
      }

      function update(time = 0) {
        if (isPaused || isGameOver) return;
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;

        if (isGrounded()) {
          lockCounter += deltaTime;
          if (lockCounter >= LOCK_DELAY) {
            lockPiece();
          }
        } else if (dropCounter > dropInterval) {
          piece.y++;
          dropCounter = 0;
          lockCounter = 0;
          lockResetCount = 0;
        }

        draw();
        animationId = requestAnimationFrame(update);
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") move(-1);
        if (event.key === "ArrowRight") move(1);
        if (event.key.toLowerCase() === "w") softDrop();
        if (event.key.toLowerCase() === "a") rotatePiece("right");
        if (event.key.toLowerCase() === "d") rotatePiece("left");
        if (event.key.toLowerCase() === "s") holdCurrentPiece();
        if (event.code === "Space") {
          event.preventDefault();
          hardDrop();
        }
        if (event.key.toLowerCase() === "p") togglePause();
      });

      restartButton.addEventListener("click", startGame);
      modeButtons.forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });
      skinButtons.forEach((button) => {
        button.addEventListener("click", () => setSkin(button.dataset.skin));
      });

      updateModeControls();
      updateSkinControls();
      startGame();
    </script>
  </body>
</html>
