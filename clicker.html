<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>クリック工房</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef1ed;
        --ink: #202426;
        --muted: #65706d;
        --panel: #fffdf7;
        --line: #d7d3c8;
        --green: #24715d;
        --green-dark: #174e42;
        --gold: #c88922;
        --red: #b84a3d;
        --blue: #386f9f;
        --shadow: rgba(30, 36, 34, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(32, 36, 38, 0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(32, 36, 38, 0.04) 1px, transparent 1px),
          repeating-linear-gradient(135deg, transparent 0 28px, rgba(36, 113, 93, 0.045) 28px 30px),
          linear-gradient(145deg, rgba(36, 113, 93, 0.18), transparent 36%),
          linear-gradient(315deg, rgba(200, 137, 34, 0.18), transparent 32%),
          var(--bg);
        background-size: 42px 42px, 42px 42px, auto, auto, auto, auto;
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        width: min(1180px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px;
        display: grid;
        grid-template-columns: minmax(340px, 1fr) 360px;
        gap: 24px;
        align-items: center;
      }

      .stage {
        min-height: 680px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 18px;
      }

      .header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 58px);
        line-height: 1;
        letter-spacing: 0;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .stat {
        min-width: 116px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 247, 0.82);
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .stat strong {
        display: block;
        margin-top: 2px;
        font-size: 20px;
        line-height: 1.1;
      }

      .click-zone {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.94), rgba(255, 253, 247, 0.66) 46%, rgba(238, 241, 237, 0.88) 72%),
          var(--panel);
        box-shadow: 0 20px 50px var(--shadow);
      }

      .click-zone::before,
      .click-zone::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .click-zone::before {
        background:
          repeating-linear-gradient(90deg, rgba(38, 45, 45, 0.10) 0 18px, rgba(255, 255, 255, 0.12) 18px 26px),
          linear-gradient(0deg, rgba(36, 113, 93, 0.18), transparent 42%);
        mask-image: linear-gradient(0deg, black 0 18%, transparent 28%);
      }

      .click-zone::after {
        background:
          linear-gradient(115deg, transparent 24%, rgba(255, 255, 255, 0.55) 29%, transparent 35%),
          repeating-linear-gradient(0deg, transparent 0 34px, rgba(36, 113, 93, 0.12) 34px 36px);
        opacity: 0.52;
        animation: shopShine 7s linear infinite;
      }

      @keyframes shopShine {
        from {
          transform: translateX(-18%);
        }
        to {
          transform: translateX(18%);
        }
      }

      .coin-button {
        position: relative;
        z-index: 1;
        width: min(58vw, 360px);
        max-width: 72%;
        aspect-ratio: 1;
        border: 0;
        border-radius: 999px;
        background:
          radial-gradient(circle at 32% 24%, #fff4b5, transparent 22%),
          radial-gradient(circle at 50% 50%, #f2c45a 0 50%, #d49227 51% 67%, #9d651d 68% 100%);
        color: #50320e;
        box-shadow:
          inset -16px -20px 24px rgba(102, 61, 13, 0.28),
          inset 8px 10px 16px rgba(255, 255, 255, 0.45),
          0 24px 42px rgba(94, 64, 22, 0.26);
        cursor: pointer;
        transition: transform 90ms ease, filter 120ms ease;
      }

      .coin-button::before {
        content: "";
        position: absolute;
        inset: -14%;
        border-radius: inherit;
        background:
          conic-gradient(from 0deg, transparent, rgba(255, 241, 168, 0.52), transparent, rgba(36, 113, 93, 0.24), transparent);
        opacity: 0.62;
        filter: blur(10px);
        animation: coinAura 8s linear infinite;
        z-index: -1;
      }

      @keyframes coinAura {
        to {
          transform: rotate(1turn);
        }
      }

      .coin-button:hover {
        filter: brightness(1.03);
      }

      .coin-button:active {
        transform: scale(0.965);
      }

      .coin-button.pop {
        animation: coinPop 220ms cubic-bezier(0.2, 1.6, 0.4, 1);
      }

      @keyframes coinPop {
        0% {
          transform: scale(0.96) rotate(0deg);
        }
        58% {
          transform: scale(1.08) rotate(-2deg);
        }
        100% {
          transform: scale(1) rotate(0deg);
        }
      }

      .coin-face {
        position: absolute;
        inset: 17%;
        display: grid;
        place-items: center;
        border: 5px solid rgba(121, 73, 18, 0.48);
        border-radius: 999px;
      }

      .coin-face svg {
        width: 54%;
        height: 54%;
        fill: #7b4b13;
      }

      .spark {
        position: absolute;
        pointer-events: none;
        color: var(--gold);
        font-size: 18px;
        font-weight: 900;
        animation: rise 850ms ease forwards;
      }

      .burst {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--gold);
        pointer-events: none;
        animation: burst 520ms ease-out forwards;
      }

      .ripple {
        position: absolute;
        width: 36px;
        height: 36px;
        border: 3px solid rgba(200, 137, 34, 0.72);
        border-radius: 999px;
        pointer-events: none;
        animation: ripple 460ms ease-out forwards;
      }

      .combo {
        position: absolute;
        z-index: 2;
        top: 24px;
        right: 24px;
        min-width: 86px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(32, 36, 38, 0.84);
        color: white;
        font-size: 15px;
        font-weight: 900;
        text-align: center;
        opacity: 0;
        transform: translateY(-8px) scale(0.94);
        transition: opacity 130ms ease, transform 130ms ease;
      }

      .combo.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      @keyframes rise {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.9);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -128px) scale(1.2);
        }
      }

      @keyframes burst {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) rotate(var(--angle)) translateX(22px) scale(1);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -50%) rotate(var(--angle)) translateX(var(--distance)) scale(0.35);
        }
      }

      @keyframes ripple {
        from {
          opacity: 0.85;
          transform: translate(-50%, -50%) scale(0.35);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(4.2);
        }
      }

      .progress-wrap {
        display: grid;
        gap: 8px;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }

      .progress {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #dcd7cb;
      }

      .progress span {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--gold));
        transition: width 180ms ease;
      }

      .sidebar {
        display: grid;
        gap: 14px;
      }

      .panel {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 12px 32px rgba(30, 36, 34, 0.08);
      }

      .panel-title {
        margin: 0 0 12px;
        font-size: 18px;
        line-height: 1.2;
      }

      .shop-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .shop-head .panel-title {
        margin: 0;
      }

      .buy-mode {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        min-width: 150px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f4f1ea;
      }

      .buy-mode button {
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
      }

      .buy-mode button.active {
        border-color: var(--line);
        background: var(--panel);
        color: var(--green-dark);
        box-shadow: 0 3px 10px rgba(30, 36, 34, 0.08);
      }

      .shop {
        display: grid;
        gap: 10px;
      }

      #shop {
        max-height: min(560px, 58vh);
        overflow-y: auto;
        padding-right: 4px;
        scrollbar-color: var(--gold) #e6e0d4;
      }

      .item {
        width: 100%;
        min-height: 78px;
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffaf0;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .item:disabled {
        opacity: 0.52;
        cursor: not-allowed;
      }

      .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #ebf2ed;
        color: var(--green-dark);
      }

      .icon svg {
        width: 26px;
        height: 26px;
        fill: currentColor;
      }

      .item-name {
        display: block;
        font-weight: 900;
      }

      .item-note {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .price {
        min-width: 68px;
        color: var(--gold);
        font-weight: 900;
        text-align: right;
      }

      .boost {
        display: grid;
        gap: 10px;
      }

      .boost button {
        min-height: 44px;
        border: 1px solid var(--green-dark);
        border-radius: 8px;
        background: var(--green);
        color: white;
        font-weight: 900;
        cursor: pointer;
      }

      .boost button:disabled {
        border-color: var(--line);
        background: #d9d4c9;
        color: #8b8478;
        cursor: not-allowed;
      }

      .prestige {
        display: grid;
        gap: 10px;
      }

      .prestige-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .prestige-box {
        min-height: 62px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f7fbf7;
      }

      .prestige-box span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .prestige-box strong {
        display: block;
        margin-top: 3px;
        font-size: 22px;
        line-height: 1;
      }

      .prestige-button {
        min-height: 44px;
        border: 1px solid #6d4b11;
        border-radius: 8px;
        background: linear-gradient(135deg, #c88922, #7b5417);
        color: white;
        font-weight: 900;
        cursor: pointer;
      }

      .prestige-button:disabled {
        border-color: var(--line);
        background: #d9d4c9;
        color: #8b8478;
        cursor: not-allowed;
      }

      .tree-open {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--green-dark);
        font-weight: 900;
        cursor: pointer;
      }

      .tree-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(24, 30, 30, 0.62);
        backdrop-filter: blur(6px);
      }

      .tree-modal.open {
        display: grid;
      }

      .tree-panel {
        width: min(980px, 100%);
        max-height: min(820px, 92vh);
        overflow: auto;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.36);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(36, 113, 93, 0.14), transparent 46%),
          linear-gradient(315deg, rgba(200, 137, 34, 0.16), transparent 42%),
          #fffdf7;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
      }

      .tree-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .tree-top h2 {
        margin: 0;
        font-size: 24px;
      }

      .tree-close {
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
      }

      .tree-status {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 18px;
      }

      .tree-map {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 14px;
      }

      .tree-node {
        min-height: 132px;
        display: grid;
        align-content: space-between;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 250, 240, 0.92);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .tree-node.locked {
        background: rgba(230, 225, 214, 0.72);
        color: #8b8478;
        cursor: not-allowed;
      }

      .tree-node.maxed {
        border-color: rgba(36, 113, 93, 0.44);
        background: #edf7f0;
      }

      .tree-node:disabled {
        opacity: 0.66;
        cursor: not-allowed;
      }

      .node-name {
        display: block;
        font-weight: 900;
      }

      .node-note,
      .node-req {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .node-cost {
        color: var(--gold);
        font-weight: 900;
      }

      .achievements {
        display: grid;
        gap: 8px;
      }

      .badge {
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-weight: 800;
      }

      .badge.unlocked {
        border-color: rgba(36, 113, 93, 0.4);
        background: #eff7f2;
        color: var(--green-dark);
      }

      .badge span:first-child {
        width: 20px;
        text-align: center;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .actions button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font-weight: 900;
        cursor: pointer;
      }

      .actions button.danger {
        color: var(--red);
      }

      @media (max-width: 900px) {
        .app {
          min-height: auto;
          grid-template-columns: 1fr;
          padding: 20px 14px 28px;
          align-items: start;
        }

        .stage {
          min-height: 560px;
        }

        .tree-map,
        .tree-status {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 560px) {
        .header {
          align-items: start;
          flex-direction: column;
        }

        .shop-head {
          align-items: stretch;
          flex-direction: column;
        }

        .buy-mode {
          width: 100%;
        }

        .stats {
          width: 100%;
          justify-content: stretch;
        }

        .stat {
          flex: 1 1 130px;
        }

        .item {
          grid-template-columns: 40px 1fr;
        }

        .price {
          grid-column: 2;
          text-align: left;
        }

        .tree-map,
        .tree-status {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="stage">
        <header class="header">
          <h1>クリック工房</h1>
          <div class="stats">
            <div class="stat">
              <span>コイン</span>
              <strong id="coins">0</strong>
            </div>
            <div class="stat">
              <span>クリック</span>
              <strong id="perClick">1</strong>
            </div>
            <div class="stat">
              <span>毎秒</span>
              <strong id="perSecond">0</strong>
            </div>
            <div class="stat">
              <span>転生P</span>
              <strong id="prestigePoints">0</strong>
            </div>
            <div class="stat">
              <span>超転生P</span>
              <strong id="superPoints">0</strong>
            </div>
          </div>
        </header>

        <div class="click-zone" id="clickZone">
          <button class="coin-button" id="coinButton" type="button" aria-label="コインを作る">
            <span class="coin-face" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <path d="M34 6 14 34h15l-5 24 25-32H34l8-20H34Z"></path>
              </svg>
            </span>
          </button>
          <div class="combo" id="comboView">x1</div>
        </div>

        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="rankName">見習い職人</span>
            <span id="nextRank">次: 100</span>
          </div>
          <div class="progress" aria-label="次のランクまで">
            <span id="rankProgress"></span>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <div class="shop-head">
            <h2 class="panel-title">ショップ</h2>
            <div class="buy-mode" aria-label="購入数">
              <button type="button" class="active" data-buy-mode="1">1個</button>
              <button type="button" data-buy-mode="10">10個</button>
              <button type="button" data-buy-mode="max">最大</button>
            </div>
          </div>
          <div class="shop" id="shop"></div>
        </section>

        <section class="panel boost">
          <h2 class="panel-title">ブースト</h2>
          <button type="button" id="boostButton">集中 15秒 x2</button>
          <div class="progress-meta">
            <span id="boostStatus">準備完了</span>
            <span id="boostCost">50</span>
          </div>
        </section>

        <section class="panel prestige">
          <h2 class="panel-title">転生</h2>
          <div class="prestige-summary">
            <div class="prestige-box">
              <span>獲得予定</span>
              <strong id="prestigeGain">0</strong>
            </div>
            <div class="prestige-box">
              <span>転生回数</span>
              <strong id="reincarnations">0</strong>
            </div>
          </div>
          <button type="button" class="prestige-button" id="prestigeButton">転生する</button>
          <button type="button" class="tree-open" id="openTreeButton">スキルツリー</button>
        </section>

        <section class="panel prestige">
          <h2 class="panel-title">超転生</h2>
          <div class="prestige-summary">
            <div class="prestige-box">
              <span>獲得予定</span>
              <strong id="superGain">0</strong>
            </div>
            <div class="prestige-box">
              <span>超転生回数</span>
              <strong id="superReincarnations">0</strong>
            </div>
          </div>
          <button type="button" class="prestige-button" id="superButton">超転生する</button>
          <button type="button" class="tree-open" id="openSuperTreeButton">超スキルツリー</button>
        </section>

        <section class="panel">
          <h2 class="panel-title">実績</h2>
          <div class="achievements" id="achievements"></div>
        </section>

        <section class="panel actions">
          <button type="button" id="saveButton">保存</button>
          <button type="button" class="danger" id="resetButton">リセット</button>
        </section>
      </aside>
    </main>

    <div class="tree-modal" id="treeModal" aria-hidden="true">
      <section class="tree-panel" aria-label="転生スキルツリー">
        <div class="tree-top">
          <h2>転生スキルツリー</h2>
          <button type="button" class="tree-close" id="closeTreeButton" aria-label="閉じる">×</button>
        </div>
        <div class="tree-status">
          <div class="prestige-box">
            <span>所持ポイント</span>
            <strong id="treePoints">0</strong>
          </div>
          <div class="prestige-box">
            <span>累計ポイント</span>
            <strong id="treeTotalPoints">0</strong>
          </div>
          <div class="prestige-box">
            <span>転生回数</span>
            <strong id="treeReincarnations">0</strong>
          </div>
        </div>
        <div class="tree-map" id="prestigeTree"></div>
      </section>
    </div>

    <div class="tree-modal" id="superTreeModal" aria-hidden="true">
      <section class="tree-panel" aria-label="超転生スキルツリー">
        <div class="tree-top">
          <h2>超転生スキルツリー</h2>
          <button type="button" class="tree-close" id="closeSuperTreeButton" aria-label="閉じる">×</button>

      function format(value) {
        const units = [
          { value: 1e68, label: "無量大数" },
          { value: 1e64, label: "不可思議" },
          { value: 1e60, label: "那由他" },
          { value: 1e56, label: "阿僧祇" },
          { value: 1e52, label: "恒河沙" },
          { value: 1e48, label: "極" },
          { value: 1e44, label: "載" },
          { value: 1e40, label: "正" },
          { value: 1e36, label: "澗" },
          { value: 1e32, label: "溝" },
          { value: 1e28, label: "穣" },
          { value: 1e24, label: "秭" },
          { value: 1e20, label: "垓" },
          { value: 1e16, label: "京" },
          { value: 1e12, label: "兆" },
          { value: 1e8, label: "億" },
          { value: 1e4, label: "万" },
        ];

        if (!Number.isFinite(value)) return "無量大数以上";
        if (value < 100 && !Number.isInteger(value)) return value.toFixed(1);
        if (value < 10000) return Math.floor(value).toString();

        const unit = units.find((item) => value >= item.value);
        const amount = value / unit.value;
        return `${amount >= 100 ? amount.toFixed(0) : amount >= 10 ? amount.toFixed(1) : amount.toFixed(2)}${unit.label}`;
      }

      function itemCost(item, currentState = state) {
        return Math.floor(item.baseCost * Math.pow(1.18, currentState.items[item.id]));
      }

      function itemCostAt(item, owned) {
        return Math.floor(item.baseCost * Math.pow(1.18, owned));
      }

      function getBuyQuantity(item) {
        if (buyMode !== "max") {
          return Number(buyMode);
        }

        let quantity = 0;
        let total = 0;
        let owned = state.items[item.id];
        while (quantity < 999) {
          const cost = itemCostAt(item, owned + quantity);
          if (total + cost > state.coins) {
            break;
          }
          total += cost;
          quantity += 1;
        }
        return Math.max(1, quantity);
      }

      function itemBulkCost(item, quantity) {
        let total = 0;
        const owned = state.items[item.id];
        for (let index = 0; index < quantity; index += 1) {
          total += itemCostAt(item, owned + index);
        }
        return total;
      }

      function prestigeUpgradeCost(upgrade, currentState = state) {
        return Math.floor(upgrade.baseCost * Math.pow(1.42, currentState.prestigeUpgrades[upgrade.id]));
      }

      function superUpgradeCost(upgrade, currentState = state) {
        return Math.floor(upgrade.baseCost * Math.pow(1.55, currentState.superUpgrades[upgrade.id]));
      }

      function getPrestigeMultiplier(id, currentState = state) {
        const upgrade = prestigeUpgrades.find((item) => item.id === id);
        return upgrade.effect(currentState.prestigeUpgrades[id], currentState);
      }

      function getSuperMultiplier(id, currentState = state) {
        const upgrade = superUpgrades.find((item) => item.id === id);
        return upgrade.effect(currentState.superUpgrades[id], currentState);
      }

      function getGlobalMultiplier(currentState = state) {
        return getPrestigeMultiplier("bulkMind", currentState)
          * getPrestigeMultiplier("cosmicMint", currentState)
          * getPrestigeMultiplier("nayutaGate", currentState)
          * getSuperMultiplier("ascendantForge", currentState)
          * getSuperMultiplier("beyondNayuta", currentState)
          * getSuperMultiplier("absoluteMint", currentState);
      }

      function meetsRequirements(upgrade, currentState = state) {
        return upgrade.requires.every((requirement) => (
          currentState.prestigeUpgrades[requirement.id] >= requirement.level
        ));
      }

      function requirementText(upgrade) {
        if (!upgrade.requires.length) {
          return "最初から開放";
        }
        return upgrade.requires.map((requirement) => {
          const required = prestigeUpgrades.find((item) => item.id === requirement.id);
          return `${required.name} Lv.${requirement.level}`;
        }).join(" / ");
      }

      function meetsSuperRequirements(upgrade, currentState = state) {
        return upgrade.requires.every((requirement) => (
          currentState.superUpgrades[requirement.id] >= requirement.level
        ));
      }

      function superRequirementText(upgrade) {
        if (!upgrade.requires.length) {
          return "最初から開放";
        }
        return upgrade.requires.map((requirement) => {
          const required = superUpgrades.find((item) => item.id === requirement.id);

      function getPerClick(currentState = state) {
        const base = 1 + shopItems.reduce((sum, item) => (
          sum + (item.perClick || 0) * currentState.items[item.id]

        const upgraded = base
          * getPrestigeMultiplier("clickPower", currentState)
          * getPrestigeMultiplier("goldenTouch", currentState)
          * getGlobalMultiplier(currentState);
        return isBoosting(currentState) ? upgraded * 2 : upgraded;

      function getPerSecond(currentState = state) {

          sum + (item.perSecond || 0) * currentState.items[item.id]

        return isBoosting(currentState) ? upgraded * 2 : upgraded;
      }

      function isBoosting(currentState = state) {
        return Date.now() < currentState.boostUntil;
      }

      function boostCost() {
        return 50 + state.boostsUsed * 75;
      }

      function getPrestigeGain() {
        const base = Math.pow(Math.max(0, state.totalEarned) / 5000, 0.62);
        const reincarnationBonus = Math.pow(1.055, state.reincarnations);
        return Math.floor(base
          * reincarnationBonus
          * getPrestigeMultiplier("prestigeEngine")
          * getSuperMultiplier("eternalCycle"));
      }

      function getSuperGain() {
        const base = Math.pow(Math.max(0, state.totalPrestigePoints) / 250, 0.68);
        const cycleBonus = Math.pow(1.08, state.superReincarnations);
        return Math.floor(base * cycleBonus * getSuperMultiplier("singularityCore"));
      }

      function createFreshRunState(source = state) {
        const fresh = structuredClone(defaultState);
        const startingCoins = prestigeUpgrades
          .find((upgrade) => upgrade.id === "seedMoney")
          .effect(source.prestigeUpgrades.seedMoney);

        fresh.coins = startingCoins;
        fresh.totalEarned = startingCoins;
        fresh.prestigePoints = source.prestigePoints;
        fresh.totalPrestigePoints = source.totalPrestigePoints;
        fresh.reincarnations = source.reincarnations;
        fresh.prestigeUpgrades = { ...defaultState.prestigeUpgrades, ...source.prestigeUpgrades };
        fresh.superPoints = source.superPoints;
        fresh.totalSuperPoints = source.totalSuperPoints;
        fresh.superReincarnations = source.superReincarnations;
        fresh.superUpgrades = { ...defaultState.superUpgrades, ...source.superUpgrades };
        fresh.achievements = { ...source.achievements };
        return fresh;
      }

      function createFreshSuperRunState(source = state) {
        const fresh = structuredClone(defaultState);
        const startingPrestige = superUpgrades
          .find((upgrade) => upgrade.id === "genesisGrant")
          .effect(source.superUpgrades.genesisGrant);

        fresh.prestigePoints = startingPrestige;
        fresh.totalPrestigePoints = startingPrestige;
        fresh.superPoints = source.superPoints;
        fresh.totalSuperPoints = source.totalSuperPoints;
        fresh.superReincarnations = source.superReincarnations;
        fresh.superUpgrades = { ...defaultState.superUpgrades, ...source.superUpgrades };
        fresh.achievements = { ...source.achievements };
        return fresh;
      }

      function earn(amount) {
        state.coins += amount;
        state.totalEarned += amount;
      }

      function clickCoin(event) {
        const amount = getPerClick();
        state.clicks += 1;
        earn(amount);
        triggerClickFeedback(event.clientX, event.clientY);
        addSpark(event.clientX, event.clientY, `+${format(amount)}`);
        checkAchievements();
        render();
      }

      function triggerClickFeedback(x, y) {
        const now = Date.now();
        combo = now - lastClickAt < 900 ? combo + 1 : 1;
        lastClickAt = now;

        coinButton.classList.remove("pop");
        void coinButton.offsetWidth;
        coinButton.classList.add("pop");

        addRipple(x, y);
        addBurst(x, y, Math.min(18, 7 + Math.floor(combo / 2)));
        showCombo();
        playClickTone(combo);

        if ("vibrate" in navigator) {
          navigator.vibrate(12);
        }
      }

      function addSpark(x, y, text) {
        const rect = clickZoneEl.getBoundingClientRect();
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.textContent = text;
        spark.style.left = `${x - rect.left}px`;
        spark.style.top = `${y - rect.top}px`;
        clickZoneEl.append(spark);
        setTimeout(() => spark.remove(), 900);
      }

      function addRipple(x, y) {
        const rect = clickZoneEl.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.left = `${x - rect.left}px`;
        ripple.style.top = `${y - rect.top}px`;
        clickZoneEl.append(ripple);
        setTimeout(() => ripple.remove(), 520);
      }

      function addBurst(x, y, count) {
        const rect = clickZoneEl.getBoundingClientRect();
        for (let index = 0; index < count; index += 1) {
          const particle = document.createElement("span");
          particle.className = "burst";
          particle.style.left = `${x - rect.left}px`;
          particle.style.top = `${y - rect.top}px`;
          particle.style.setProperty("--angle", `${(360 / count) * index + Math.random() * 18}deg`);
          particle.style.setProperty("--distance", `${64 + Math.random() * 82}px`);
          particle.style.background = index % 3 === 0 ? "#fff1a8" : index % 3 === 1 ? "#c88922" : "#24715d";
          clickZoneEl.append(particle);
          setTimeout(() => particle.remove(), 560);
        }
      }

      function showCombo() {
        clearTimeout(comboTimer);
        comboView.textContent = `x${combo}`;
        comboView.classList.add("show");
        comboTimer = setTimeout(() => {
          combo = 0;
          comboView.classList.remove("show");
        }, 1000);
      }

      function playClickTone(currentCombo) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) {
          return;
        }

        audioContext ||= new AudioCtor();
        const now = audioContext.currentTime;
        const gain = audioContext.createGain();
        const osc = audioContext.createOscillator();
        const pitch = 260 + Math.min(18, currentCombo) * 18;

        osc.type = "triangle";
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 1.7, now + 0.075);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.055, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.105);

        osc.connect(gain).connect(audioContext.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      function buyItem(item) {
        const quantity = getBuyQuantity(item);
        const cost = itemBulkCost(item, quantity);
        if (state.coins < cost) {
          return;
        }
        state.coins -= cost;
        state.items[item.id] += quantity;
        checkAchievements();
        render(true);
      }

      function buyPrestigeUpgrade(upgrade) {
        const cost = prestigeUpgradeCost(upgrade);
        const level = state.prestigeUpgrades[upgrade.id];
        if (level >= upgrade.maxLevel || !meetsRequirements(upgrade) || state.prestigePoints < cost) {
          return;
        }

        state.prestigePoints -= cost;
        state.prestigeUpgrades[upgrade.id] += 1;
        render(true);
        saveState();
      }

      function reincarnate() {
        const gain = getPrestigeGain();
        if (gain <= 0) {
          return;
        }

        state.prestigePoints += gain;
        state.totalPrestigePoints += gain;
        state.reincarnations += 1;
        state = createFreshRunState(state);
        checkAchievements();
        saveState();
        render(true);
        openPrestigeTree();
      }

      function buySuperUpgrade(upgrade) {
        const cost = superUpgradeCost(upgrade);
        const level = state.superUpgrades[upgrade.id];
        if (level >= upgrade.maxLevel || !meetsSuperRequirements(upgrade) || state.superPoints < cost) {
          return;
        }

        state.superPoints -= cost;
        state.superUpgrades[upgrade.id] += 1;
        render(true);
        saveState();
      }

      function superReincarnate() {
        const gain = getSuperGain();
        if (gain <= 0) {
          return;
        }

        state.superPoints += gain;
        state.totalSuperPoints += gain;
        state.superReincarnations += 1;
        state = createFreshSuperRunState(state);
        checkAchievements();
        saveState();
        render(true);
        openSuperTree();
      }

      function useBoost() {
        const cost = boostCost();
        if (state.coins < cost || isBoosting()) {
          return;
        }
        state.coins -= cost;
        state.boostsUsed += 1;
        state.boostUntil = Date.now() + 15000;
        checkAchievements();
        render();
      }

      function checkAchievements() {
        for (const achievement of achievementList) {
          if (!state.achievements[achievement.id] && achievement.test(state)) {
            state.achievements[achievement.id] = true;
          }
        }
      }

      function getShopSignature() {
        return shopItems.map((item) => {
          const quantity = getBuyQuantity(item);
          const cost = itemBulkCost(item, quantity);
          const canBuy = state.coins >= cost ? "1" : "0";
          return `${item.id}:${state.items[item.id]}:${quantity}:${cost}:${canBuy}`;
        }).concat(buyMode).join("|");
      }

      function renderShop(force = false) {
        const signature = getShopSignature();
        if (!force && signature === lastShopSignature) {
          return;
        }
        lastShopSignature = signature;
        shopEl.innerHTML = "";
        for (const item of shopItems) {
          const quantity = getBuyQuantity(item);
          const cost = itemBulkCost(item, quantity);
          const button = document.createElement("button");
          button.type = "button";
          button.className = "item";
          button.disabled = state.coins < cost;
          button.innerHTML = `
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 64 64">${item.svg}</svg></span>
            <span>
              <span class="item-name">${item.name} x${state.items[item.id]}</span>
              <span class="item-note">${item.note} / 購入 x${quantity}</span>
            </span>
            <span class="price">${format(cost)}</span>
          `;
          button.addEventListener("click", () => buyItem(item));
          shopEl.append(button);
        }
      }

      function renderAchievements(force = false) {
        const signature = achievementList.map((achievement) => (
          `${achievement.id}:${state.achievements[achievement.id] ? "1" : "0"}`
        )).join("|");
        if (!force && signature === lastAchievementSignature) {
          return;
        }
        lastAchievementSignature = signature;
        achievementsEl.innerHTML = "";
        for (const achievement of achievementList) {
          const unlocked = Boolean(state.achievements[achievement.id]);
          const badge = document.createElement("div");
          badge.className = `badge${unlocked ? " unlocked" : ""}`;
          badge.innerHTML = `<span>${unlocked ? "✓" : "·"}</span><span>${achievement.label}</span>`;
          achievementsEl.append(badge);
        }
      }

      function renderRank() {
        const current = ranks.reduce((best, rank) => (
          state.totalEarned >= rank.total ? rank : best
        ), ranks[0]);
        const next = ranks.find((rank) => rank.total > state.totalEarned);
        rankNameEl.textContent = current.name;
        if (!next) {
          nextRankEl.textContent = "最高ランク";
          rankProgressEl.style.width = "100%";
          return;
        }

        const previousTotal = current.total;
        const progress = (state.totalEarned - previousTotal) / (next.total - previousTotal);
        nextRankEl.textContent = `次: ${format(next.total)}`;
        rankProgressEl.style.width = `${Math.max(0, Math.min(100, progress * 100))}%`;
      }

      function renderBoost() {
        const cost = boostCost();
        const remaining = Math.max(0, Math.ceil((state.boostUntil - Date.now()) / 1000));
        boostCostEl.textContent = isBoosting() ? `${remaining}秒` : format(cost);
        boostStatusEl.textContent = isBoosting() ? "集中作業中" : "準備完了";
        boostButton.disabled = state.coins < cost || isBoosting();
      }

      function getPrestigeSignature() {
        return [
          state.prestigePoints,
          state.totalPrestigePoints,
          state.reincarnations,
          getPrestigeGain(),
          ...prestigeUpgrades.map((upgrade) => {
            const cost = prestigeUpgradeCost(upgrade);
            const canBuy = state.prestigePoints >= cost && meetsRequirements(upgrade) ? "1" : "0";
            return `${upgrade.id}:${state.prestigeUpgrades[upgrade.id]}:${cost}:${canBuy}`;
          }),
        ].join("|");
      }

      function openPrestigeTree() {
        treeModal.classList.add("open");
        treeModal.setAttribute("aria-hidden", "false");
        render(true);
      }

      function closePrestigeTree() {
        treeModal.classList.remove("open");
        treeModal.setAttribute("aria-hidden", "true");
      }

      function renderPrestige(force = false) {
        const gain = getPrestigeGain();
        prestigePointsEl.textContent = format(state.prestigePoints);
        prestigeGainEl.textContent = format(gain);
        reincarnationsEl.textContent = format(state.reincarnations);
        prestigeButton.disabled = gain <= 0;

        const signature = getPrestigeSignature();
        if (!force && signature === lastPrestigeSignature) {
          return;
        }
        lastPrestigeSignature = signature;
        renderPrestigeTree();
      }

      function renderPrestigeTree() {
        treePointsEl.textContent = format(state.prestigePoints);
        treeTotalPointsEl.textContent = format(state.totalPrestigePoints);
        treeReincarnationsEl.textContent = format(state.reincarnations);
        prestigeTreeEl.innerHTML = "";

        for (const upgrade of prestigeUpgrades) {
          const level = state.prestigeUpgrades[upgrade.id];
          const cost = prestigeUpgradeCost(upgrade);
          const unlocked = meetsRequirements(upgrade);
          const maxed = level >= upgrade.maxLevel;
          const button = document.createElement("button");
          button.type = "button";
          button.className = `tree-node${unlocked ? "" : " locked"}${maxed ? " maxed" : ""}`;
          button.disabled = !unlocked || maxed || state.prestigePoints < cost;
          button.innerHTML = `
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 64 64">${upgrade.svg}</svg></span>
            <span>
              <span class="node-name">${upgrade.name} Lv.${level}/${upgrade.maxLevel}</span>
              <span class="node-note">${upgrade.note}</span>
              <span class="node-req">${unlocked ? "開放済み" : `条件: ${requirementText(upgrade)}`}</span>
            </span>
            <span class="node-cost">${maxed ? "最大" : `${format(cost)}P`}</span>
          `;
          button.addEventListener("click", () => buyPrestigeUpgrade(upgrade));
          prestigeTreeEl.append(button);
        }
      }

      function getSuperSignature() {
        return [
          state.superPoints,
          state.totalSuperPoints,
          state.superReincarnations,
          getSuperGain(),
          ...superUpgrades.map((upgrade) => {
            const cost = superUpgradeCost(upgrade);
            const canBuy = state.superPoints >= cost && meetsSuperRequirements(upgrade) ? "1" : "0";
            return `${upgrade.id}:${state.superUpgrades[upgrade.id]}:${cost}:${canBuy}`;
          }),
        ].join("|");
      }

      function openSuperTree() {
        superTreeModal.classList.add("open");
        superTreeModal.setAttribute("aria-hidden", "false");
        render(true);
      }

      function closeSuperTree() {
        superTreeModal.classList.remove("open");
        superTreeModal.setAttribute("aria-hidden", "true");
      }

      function renderSuper(force = false) {
        const gain = getSuperGain();
        superPointsEl.textContent = format(state.superPoints);
        superGainEl.textContent = format(gain);
        superReincarnationsEl.textContent = format(state.superReincarnations);
        superButton.disabled = gain <= 0;

        const signature = getSuperSignature();
        if (!force && signature === lastSuperSignature) {
          return;
        }
        lastSuperSignature = signature;
        renderSuperTree();
      }

      function renderSuperTree() {
        superTreePointsEl.textContent = format(state.superPoints);
        superTreeTotalPointsEl.textContent = format(state.totalSuperPoints);
        superTreeReincarnationsEl.textContent = format(state.superReincarnations);
        superTreeEl.innerHTML = "";

        for (const upgrade of superUpgrades) {
          const level = state.superUpgrades[upgrade.id];
          const cost = superUpgradeCost(upgrade);
          const unlocked = meetsSuperRequirements(upgrade);
          const maxed = level >= upgrade.maxLevel;
          const button = document.createElement("button");
          button.type = "button";
          button.className = `tree-node${unlocked ? "" : " locked"}${maxed ? " maxed" : ""}`;
          button.disabled = !unlocked || maxed || state.superPoints < cost;
          button.innerHTML = `
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 64 64">${upgrade.svg}</svg></span>
            <span>
              <span class="node-name">${upgrade.name} Lv.${level}/${upgrade.maxLevel}</span>
              <span class="node-note">${upgrade.note}</span>
              <span class="node-req">${unlocked ? "開放済み" : `条件: ${superRequirementText(upgrade)}`}</span>
            </span>
            <span class="node-cost">${maxed ? "最大" : `${format(cost)}SP`}</span>
          `;
          button.addEventListener("click", () => buySuperUpgrade(upgrade));
          superTreeEl.append(button);
        }
      }

      function render(forceStatic = false) {
        coinsEl.textContent = format(state.coins);
        perClickEl.textContent = format(getPerClick());
        perSecondEl.textContent = format(getPerSecond());
        buyModeButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.buyMode === buyMode);
        });
        renderShop(forceStatic);
        renderPrestige(forceStatic);
        renderSuper(forceStatic);
        renderAchievements(forceStatic);
        renderRank();
        renderBoost();
      }

      function tick(now) {
        const delta = Math.min(1, (now - lastTick) / 1000);
        lastTick = now;
        const passive = getPerSecond() * delta;
        if (passive > 0) {
          earn(passive);
          checkAchievements();
        }
        render();
        requestAnimationFrame(tick);
      }

      coinButton.addEventListener("click", clickCoin);
      buyModeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          buyMode = button.dataset.buyMode;
          render(true);
        });
      });
      boostButton.addEventListener("click", useBoost);
      prestigeButton.addEventListener("click", reincarnate);
      superButton.addEventListener("click", superReincarnate);
      openTreeButton.addEventListener("click", openPrestigeTree);
      closeTreeButton.addEventListener("click", closePrestigeTree);
      treeModal.addEventListener("click", (event) => {
        if (event.target === treeModal) {
          closePrestigeTree();
        }
      });
      openSuperTreeButton.addEventListener("click", openSuperTree);
      closeSuperTreeButton.addEventListener("click", closeSuperTree);
      superTreeModal.addEventListener("click", (event) => {
        if (event.target === superTreeModal) {
          closeSuperTree();
        }
      });
      saveButton.addEventListener("click", () => {
        saveState();
        saveButton.textContent = "保存済み";
        setTimeout(() => {
          saveButton.textContent = "保存";
        }, 900);
      });
      resetButton.addEventListener("click", () => {
        state = structuredClone(defaultState);
        saveState();
        render(true);
      });

      window.addEventListener("beforeunload", saveState);
      checkAchievements();
      render(true);
      requestAnimationFrame(tick);
      setInterval(saveState, 8000);
    </script>
  </body>
</html>
